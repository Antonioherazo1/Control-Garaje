# Mosquitto: broker MQTT para GarageControl
# Copia este archivo a /etc/mosquitto/conf.d/garaje.conf en la EC2
# (y sustituye las rutas del certificado por las tuyas).

persistence true
persistence_location /var/lib/mosquitto/

# ---------------------------------------------------------------
# Escucha LOCAL (solo el servidor Node en la misma maquina)
# No expuesto a internet: el servidor Node publica los comandos aqui.
# ---------------------------------------------------------------
listener 1883 127.0.0.1
allow_anonymous true

# ---------------------------------------------------------------
# Escucha PUBLICA para el ESP8266 (TLS obligatorio)
# El ESP8266 se conecta a garaje.thinc.site:8883
# ---------------------------------------------------------------
listener 8883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/garaje.passwd

# Certificado TLS (Let's Encrypt para garaje.thinc.site)
# Se genera con:  sudo certbot certonly --nginx -d garaje.thinc.site
certfile /etc/letsencrypt/live/garaje.thinc.site/fullchain.pem
keyfile /etc/letsencrypt/live/garaje.thinc.site/privkey.pem

# Algunas versiones antiguas de los clientes ESP8266 no soportan MQTT 5
mqtt_version 3.1.1
