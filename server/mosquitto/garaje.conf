# Mosquitto: broker MQTT del garaje (contenedor separado de Iot Energy)
# Se usa con docker-compose.garaje.yml. Las rutas son las del contenedor.

persistence true
persistence_location /mosquitto/data/

# ---------------------------------------------------------------
# Escucha LOCAL (solo el servidor Node). Docker solo lo publica en
# 127.0.0.1 del host (ver docker-compose.garaje.yml), por eso aqui
# escucha en 0.0.0.0 dentro del contenedor.
# ---------------------------------------------------------------
listener 1884 0.0.0.0
allow_anonymous true

# ---------------------------------------------------------------
# Escucha PUBLICA para el ESP8266 (TLS + usuario/clave obligatorios)
# El ESP8266 se conecta a garaje.thinc.site:8883
# ---------------------------------------------------------------
listener 8883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/garaje.passwd

# Certificado TLS (Let's Encrypt para garaje.thinc.site)
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem

# Algunas versiones antiguas de los clientes ESP8266 no soportan MQTT 5
mqtt_version 3.1.1
