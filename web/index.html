<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Garage Control</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <section id="view-login" class="view">
    <div class="card login-card">
      <h1>Garage Control</h1>
      <p class="muted">Control de portones</p>
      <form id="login-form">
        <label for="login-user">Usuario</label>
        <input id="login-user" type="text" autocomplete="username" placeholder="Tu usuario" required>
        <label for="login-pin">PIN</label>
        <input id="login-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="current-password" placeholder="Tu PIN" required>
        <button type="submit" id="login-btn">Entrar</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </div>
  </section>

  <section id="view-app" class="view hidden">
    <header>
      <div>
        <h1>Garage Control</h1>
        <p id="user-label" class="muted"></p>
      </div>
      <div class="status-row">
        <span id="wifi-icon" class="wifi-icon">
          <span class="wifi-bar"></span>
          <span class="wifi-bar"></span>
          <span class="wifi-bar"></span>
          <span class="wifi-bar"></span>
        </span>
        <span id="status-device" class="pill offline">Dispositivo: —</span>
        <button id="btn-logout" class="ghost">Salir</button>
      </div>
    </header>

    <nav id="main-nav">
      <button class="nav-btn active" data-view="home">Inicio</button>
      <button class="nav-btn" data-view="historial">Historial</button>
      <button class="nav-btn nav-admin" data-view="test">Prueba</button>
      <button class="nav-btn nav-admin" data-view="users">Usuarios</button>
      <button class="nav-btn nav-admin" data-view="newuser">Nuevo usuario</button>
      <button class="nav-btn nav-admin" data-view="temppin">PIN temporal</button>
    </nav>

    <main>
      <!-- Inicio: Puertas -->
      <div id="panel-home" class="view-panel">
        <div id="doors" class="doors"></div>
      </div>

      <!-- Historial -->
      <div id="panel-historial" class="view-panel hidden">
        <section class="panel">
          <h2>Historial
            <button id="btn-refresh-history" class="ghost small">Actualizar</button>
          </h2>
          <div id="history-list" class="history-list"><p class="muted">Cargando...</p></div>
        </section>
      </div>

      <!-- Prueba de dispositivo -->
      <div id="panel-test" class="view-panel hidden">
        <section class="panel">
          <h2>Prueba del dispositivo</h2>
          <p class="muted">Envia un pulso al LED de la placa y la salida D6.</p>
          <div class="btn-row">
            <button id="btn-test" class="ghost">Probar ahora</button>
          </div>
        </section>
      </div>

      <!-- Usuarios -->
      <div id="panel-users" class="view-panel hidden">
        <section class="panel">
          <h2>Usuarios</h2>
          <div id="users-list"></div>
        </section>
      </div>

      <!-- Nuevo usuario -->
      <div id="panel-newuser" class="view-panel hidden">
        <section class="panel">
          <h2>Nuevo usuario</h2>
          <form id="user-form" class="row-form">
            <input id="user-id" type="text" placeholder="ID (ej: maria)" required>
            <input id="user-name" type="text" placeholder="Nombre (ej: Maria)" required>
            <input id="user-pin" type="password" inputmode="numeric" minlength="4" placeholder="PIN (4+ digitos)" required>
            <div class="check-group">
              <label class="check"><input type="checkbox" value="door1" checked> Abatible</label>
              <label class="check"><input type="checkbox" value="door2" checked> Reja</label>
            </div>
            <div class="time-row">
              <input id="user-start" type="time" value="00:00">
              <span>a</span>
              <input id="user-end" type="time" value="23:59">
            </div>
            <input id="user-limit" type="number" min="0" value="0" placeholder="Limite diario (0 = sin limite)">
            <button type="submit">Crear usuario</button>
          </form>
          <p id="user-result" class="ok hidden"></p>
        </section>
      </div>

      <!-- PIN temporal -->
      <div id="panel-temppin" class="view-panel hidden">
        <section class="panel">
          <h2>Nuevo PIN temporal</h2>
          <form id="temp-form" class="row-form">
            <input id="temp-name" type="text" placeholder="Nombre del invitado" class="form-full">
            <div class="check-group">
              <label class="check"><input type="checkbox" value="door1" checked> Abatible</label>
              <label class="check"><input type="checkbox" value="door2" checked> Reja</label>
            </div>
            <input id="temp-hours" type="number" min="1" max="720" value="24" placeholder="Horas de validez">
            <button type="submit">Generar PIN</button>
          </form>
          <p id="temp-result" class="ok hidden"></p>
        </section>
      </div>
    </main>
  </section>

  <script src="js/app.js"></script>
</body>
</html>
