<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Garage Control</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <section id="view-login" class="view">
    <div class="card login-card">
      <h1>Garage Control</h1>
      <p class="muted">Control de portones</p>
      <form id="login-form">
        <label for="login-user">Usuario</label>
        <input id="login-user" type="text" autocomplete="username" required>
        <label for="login-pin">PIN</label>
        <input id="login-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="current-password" required>
        <button type="submit" id="login-btn">Entrar</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </div>
  </section>

  <section id="view-app" class="view hidden">
    <header>
      <div>
        <h1>Garage Control</h1>
        <p id="user-label" class="muted"></p>
      </div>
      <div class="status-row">
        <span id="status-device" class="pill offline">Dispositivo: —</span>
        <button id="btn-logout" class="ghost">Salir</button>
      </div>
    </header>

    <main>
      <div id="doors" class="doors"></div>

      <section class="panel">
        <h2>Historial
          <button id="btn-refresh-history" class="ghost small">Actualizar</button>
        </h2>
        <div id="history-list" class="history-list"><p class="muted">Cargando...</p></div>
      </section>

      <section id="panel-admin" class="panel hidden">
        <h2>Administracion</h2>
        <div class="btn-row">
          <button id="btn-test" class="ghost">Prueba del dispositivo</button>
        </div>
        <h3>Usuarios</h3>
        <div id="users-list"></div>

        <h3>Nuevo usuario</h3>
        <form id="user-form" class="row-form">
          <input id="user-id" type="text" placeholder="ID (p.ej. maria)" required>
          <input id="user-name" type="text" placeholder="Nombre (p.ej. Maria)" required>
          <input id="user-pin" type="password" inputmode="numeric" minlength="4" placeholder="PIN (4+ digitos)" required>
          <div>
            <label class="check"><input type="checkbox" value="door1" checked> Portón Abatible</label>
            <label class="check"><input type="checkbox" value="door2" checked> Reja Corrediza</label>
          </div>
          <div class="inline">
            <input id="user-start" type="time" value="00:00" title="Inicio horario">
            <input id="user-end" type="time" value="23:59" title="Fin horario">
          </div>
          <input id="user-limit" type="number" min="0" value="0" title="Limite diario (0 = ilimitado)">
          <button type="submit">Crear usuario</button>
        </form>
        <p id="user-result" class="ok hidden"></p>

        <h3>Nuevo PIN temporal</h3>
        <form id="temp-form" class="row-form">
          <input id="temp-name" type="text" placeholder="Nombre del invitado">
          <div>
            <label class="check"><input type="checkbox" value="door1" checked> Portón Abatible</label>
            <label class="check"><input type="checkbox" value="door2" checked> Reja Corrediza</label>
          </div>
          <input id="temp-hours" type="number" min="1" max="720" value="24" title="Horas de validez">
          <button type="submit">Generar PIN</button>
        </form>
        <p id="temp-result" class="ok hidden"></p>
      </section>
    </main>
  </section>

  <script src="js/app.js"></script>
</body>
</html>
