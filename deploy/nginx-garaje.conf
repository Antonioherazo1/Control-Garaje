# GarageControl - nginx para garaje.thinc.site
# Copia a /etc/nginx/sites-available/garaje.thinc.site y activa con:
#   sudo ln -s /etc/nginx/sites-available/garaje.thinc.site /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d garaje.thinc.site
#   sudo nginx -t && sudo systemctl reload nginx
#
# Nota: convive con Iot Energy (thinc.site) como server block independiente.

server {
    listen 80;
    server_name garaje.thinc.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name garaje.thinc.site;

    ssl_certificate     /etc/letsencrypt/live/garaje.thinc.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/garaje.thinc.site/privkey.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
